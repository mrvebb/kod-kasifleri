<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Kod Kaşifleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: an island-map game hub — big tappable cards on a water-blue ground, each game a full stage with board + controls side by side (stacks on phones). Deliberately single bright theme for children. */
:root{
  --sky:#E4F3FA; --paper:#FFFFFF; --ink:#16324F; --ink-soft:#4C6479; --line:#C7DEEA;
  --coral:#FF6B4A; --sun:#FFC63A; --leaf:#3FAE5E; --plum:#7457D3; --sea:#3EA6D2; --sea-deep:#2385B3;
  --grass:#A8DB7C; --grass-2:#9AD16E; --sand:#F6E3B4;
  --up:#3FAE5E; --down:#E5484D; --left:#2F8FE0; --right:#F2B705;
  --font-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sky);border-bottom:2px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:.2px;background:none;border:0;padding:0}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--sun);display:grid;place-items:center;font-size:20px;transform:rotate(-6deg)}
.logo small{display:block;font-family:var(--font-body);font-weight:700;font-size:11px;color:var(--ink-soft);letter-spacing:.6px;text-transform:uppercase;line-height:1}
.top .sp{flex:1}
.pill-btn{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:800;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.pill-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:18px;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}

/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding-block:28px 12px}
.hero h1{font-size:clamp(36px,6vw,64px);font-weight:800;letter-spacing:-.5px}
.hero h1 span{color:var(--coral)}
.hero p{font-size:18px;color:var(--ink-soft);max-width:52ch;margin:10px 0 0}
.hero .map{background:var(--sea);border-radius:28px;padding:18px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);position:relative;overflow:hidden}
.hero .map .mini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.hero .map .mini i{aspect-ratio:1;border-radius:8px;background:var(--grass);display:grid;place-items:center;font-style:normal;font-size:clamp(14px,3vw,26px)}
.hero .map .mini i.w{background:transparent}
.hero .map .mini i.p{background:#FFE08A}
.zone{margin-top:34px}
.zone-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.zone-head h2{font-size:30px;font-weight:800}
.zone-head .tag{font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:999px;color:#fff}
.zone-head p{margin:0;color:var(--ink-soft);flex-basis:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gcard{text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--ink);transition:transform .12s}
.gcard:hover{transform:translateY(-3px)}
.gcard:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.gcard .ico{font-size:40px;line-height:1;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;margin-bottom:4px}
.gcard h3{font-size:22px;font-weight:800}
.gcard p{margin:0;color:var(--ink-soft);font-size:15px}
.gcard .meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:var(--ink-soft)}
.gcard .stars{color:#D89A00;letter-spacing:1px}
.teacher{margin-top:40px;background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:18px 20px}
.teacher summary{font-family:var(--font-display);font-weight:800;font-size:20px;cursor:pointer}
.teacher table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.teacher th,.teacher td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.teacher th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft)}
.tablebox{overflow-x:auto}

/* game stage */
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.ghead h2{font-size:32px;font-weight:800}
.ghead .lv{font-weight:800;color:var(--ink-soft)}
.ghead .sp{flex:1}
.task{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;margin-bottom:14px}
.task .say{flex:none}
.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);padding:16px;box-shadow:0 5px 0 var(--ink);min-width:0}
.panel h3{font-size:20px;margin-bottom:8px}
.muted{color:var(--ink-soft)}
.small{font-size:14px}

/* board */
.boardwrap{background:var(--sea);border:3px solid var(--ink);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--ink)}
.board{position:relative;display:grid;gap:4px;container-type:inline-size;margin:0 auto}
.cell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;position:relative}
.cell.g{background:var(--grass)}
.cell.g.alt{background:var(--grass-2)}
.cell.w{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.cell.r{background:var(--grass)}
.cell .e{font-size:calc(100cqw / var(--w) * .58);line-height:1;user-select:none}
.cell.s{background:#FFE08A}
.cell .e.got{transform:scale(0);opacity:0;transition:.3s}
.hero-sprite{position:absolute;display:grid;place-items:center;pointer-events:none;transition:left .32s ease,top .32s ease;z-index:3}
.hero-sprite .e{font-size:calc(100cqw / var(--w) * .66);line-height:1;transition:transform .2s;display:inline-block}
.hero-sprite.bump .e{animation:bump .35s}
.hero-sprite.win .e{animation:hop .6s 2}
@keyframes bump{30%{transform:translateX(var(--bx,0)) translateY(var(--by,0)) rotate(-12deg)}100%{transform:none}}
@keyframes hop{50%{transform:translateY(-30%) scale(1.15)}}
.ripple{position:absolute;inset:0;pointer-events:none;border-radius:22px}

/* command palette & program */
.palette{display:flex;flex-wrap:wrap;gap:10px}
.cmd{width:64px;height:64px;border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;box-shadow:0 4px 0 var(--ink);padding:0}
.cmd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.cmd.U{background:var(--up)} .cmd.D{background:var(--down)} .cmd.L{background:var(--left)} .cmd.R{background:var(--right);color:var(--ink)}
.cmd.loop{background:var(--plum);font-size:15px;width:auto;padding:0 12px;font-family:var(--font-display)}
.cmd svg{width:32px;height:32px}
.prog{min-height:76px;border:3px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-block:12px}
.prog:empty::before{content:attr(data-empty);color:var(--ink-soft);font-weight:700;padding:14px 6px}
.chip{width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);display:grid;place-items:center;color:#fff;padding:0;position:relative}
.chip svg{width:24px;height:24px}
.chip.U{background:var(--up)} .chip.D{background:var(--down)} .chip.L{background:var(--left)} .chip.R{background:var(--right);color:var(--ink)}
.chip.now{outline:4px solid var(--ink);outline-offset:2px;transform:scale(1.1)}
.chip.bad{animation:shake .4s 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.loopbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 6px;border:3px solid var(--plum);border-radius:14px;background:#EFEAFD}
.loopbox.open{border-style:dashed}
.loopbox .lh{display:flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:800;color:var(--plum)}
.loopbox .cnt{border:2px solid var(--plum);background:#fff;border-radius:10px;min-width:40px;height:36px;font-weight:800;color:var(--plum)}
.loopbox .done{border:0;background:var(--plum);color:#fff;border-radius:10px;padding:4px 10px;font-weight:800}
.loopbox .x{border:0;background:none;color:var(--plum);font-weight:900;font-size:18px;padding:0 4px}
.loopbox .lb{display:flex;gap:4px;flex-wrap:wrap;min-height:44px;align-items:center}
.loopbox .lb:empty::before{content:"oku buraya ekle";font-size:13px;color:var(--plum);font-weight:700;padding:0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go{background:var(--leaf);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 20px;font-family:var(--font-display);font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--ink)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.go[disabled]{opacity:.5;cursor:not-allowed}
.ghost{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:800}
.counter{font-weight:800;color:var(--ink-soft);font-size:14px}
.counter b{color:var(--ink)}
.msg{min-height:28px;font-weight:800;margin-top:10px}
.msg.bad{color:var(--down)} .msg.good{color:var(--leaf)}

/* level select */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.lvbtn{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px 8px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.lvbtn b{font-family:var(--font-display);font-size:30px;line-height:1}
.lvbtn span{font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center;line-height:1.2}
.lvbtn i{font-style:normal;color:#D89A00;letter-spacing:1px;font-size:14px}
.lvbtn.new{border-style:dashed}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(22,50,79,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 0 var(--ink);animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.modal .big{font-size:56px;line-height:1}
.modal h3{font-size:30px;margin:6px 0}
.modal .st{font-size:40px;letter-spacing:6px;color:#D89A00}
.modal .st .off{color:var(--line)}
.modal .row{justify-content:center;margin-top:16px}

/* robot chef & pattern */
.steps{display:grid;gap:10px}
.step{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;font-size:17px;text-align:left;box-shadow:0 3px 0 var(--ink);width:100%}
.step .em{font-size:30px;flex:none}
.step.used{opacity:.3;pointer-events:none}
.slot{display:flex;align-items:center;gap:12px;border:3px dashed var(--line);border-radius:14px;padding:8px 12px;min-height:60px;font-weight:700;font-size:17px;background:var(--paper);text-align:left;width:100%}
.slot .n{width:34px;height:34px;flex:none;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800}
.slot.filled{border-style:solid;border-color:var(--ink)}
.slot.ok{border-color:var(--leaf);background:#E7F7EA}
.slot.no{border-color:var(--down);background:#FDE8E8}
.seq{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:18px 8px}
.seq .it{width:64px;height:64px;border-radius:16px;background:var(--sky);display:grid;place-items:center;font-size:38px;border:2px solid var(--line)}
.seq .it.q{background:var(--sun);border:3px dashed var(--ink);font-family:var(--font-display);font-weight:800}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.choice{width:88px;height:88px;border-radius:20px;border:3px solid var(--ink);background:var(--paper);font-size:46px;box-shadow:0 4px 0 var(--ink);padding:0}
.choice.ok{background:#CFF0D7} .choice.no{background:#FBD5D5}
.progress{height:14px;border-radius:999px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .3s}

/* logic */
.circuit{width:100%;height:auto;display:block}
.circuit .sw{cursor:pointer}
.circuit text{font-family:var(--font-display);font-weight:800}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.legend div{border-radius:14px;padding:10px 12px;color:#fff;font-weight:700;font-size:14px}
.legend b{font-family:var(--font-display);font-size:20px;display:block}
.found{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.combo{display:flex;gap:4px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:4px 8px;background:#FFF6D6;font-weight:800;font-size:14px}
.combo.ghosted{background:var(--sky);border-style:dashed;color:var(--ink-soft)}
.bit{display:inline-block;min-width:54px;text-align:center;border-radius:8px;padding:1px 6px;font-size:12px;font-weight:800}
.bit.on{background:var(--leaf);color:#fff}
.bit.off{background:#DDE6EC;color:var(--ink-soft)}
.tt{border-collapse:collapse;margin-top:8px;font-size:14px}
.tt th,.tt td{border:2px solid var(--line);padding:6px 8px;text-align:center}
.tt th{font-family:var(--font-display);font-size:16px}
.bulb{display:inline-block;width:22px;height:22px;border-radius:50%;background:#C9D3DA;border:2px solid var(--ink);vertical-align:middle}
.bulb.on{background:var(--sun);box-shadow:0 0 10px 3px rgba(255,198,58,.8)}
.yn{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.yn button{min-width:140px;font-size:24px}
.story{font-size:20px;font-weight:700;line-height:1.45}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.fact{border:2px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:800;background:var(--sky)}
.fact.y{background:#D7F2DE} .fact.n{background:#FBDCDC}
.gatepill{display:inline-block;border-radius:8px;padding:0 8px;color:#fff;font-family:var(--font-display);font-weight:800}
.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.opts button{border:3px solid var(--ink);border-radius:14px;padding:10px 18px;color:#fff;font-family:var(--font-display);font-weight:800;font-size:22px;box-shadow:0 4px 0 var(--ink)}

/* camera */
.cam{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--ink);background:#0E2236;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam video.mirror{transform:scaleX(-1)}
.cam .box{position:absolute;left:30%;top:22%;width:40%;height:56%;border:4px dashed #fff;border-radius:16px;transition:border-color .2s}
.cam .zones div{position:absolute;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:900;background:rgba(255,255,255,.08);transition:background .15s}
.cam .zones .zu{left:25%;right:25%;top:0;height:24%}
.cam .zones .zd{left:25%;right:25%;bottom:0;height:24%}
.cam .zones .zl{left:0;top:25%;bottom:25%;width:24%}
.cam .zones .zr{right:0;top:25%;bottom:25%;width:24%}
.cam .zones .hit{background:rgba(255,198,58,.6)}
.cam .off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:16px;font-weight:700}
.camnote{border-left:6px solid var(--sun);background:#FFF6D6;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:10px}
.det{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:800}
.det .sw2{width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);background:#DDE6EC}
.ring{height:8px;border-radius:999px;background:var(--line);overflow:hidden;flex:1;max-width:160px}
.ring i{display:block;height:100%;background:var(--ink);width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;background:var(--paper)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cardsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pcard{aspect-ratio:3/4;border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center;color:#fff}
.pcard svg{width:60%;height:auto}
.pcard span{font-family:var(--font-display);font-weight:800;font-size:18px}
.photo-prev{max-width:100%;border-radius:12px;border:2px solid var(--line);margin-top:10px;display:block}
.colorpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.colorpad button{height:52px;border-radius:12px;border:3px solid var(--ink);font-weight:800;color:#fff}

/* race */
.track{background:#3E8E4F}
.track .cell.road{background:#59646E;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.track .cell.grass{background:#5FB36B;border-radius:6px}
.track .cell.grass.alt{background:#56AA62}
.track .cell.fin{background:repeating-conic-gradient(#16324F 0 25%,#fff 0 50%) 0 0/50% 50%;border-radius:6px}
.track .cell.start{background:#59646E;box-shadow:inset 0 0 0 4px #FFC63A;border-radius:6px}
.car{position:absolute;display:grid;place-items:center;pointer-events:none;transition:left .3s linear,top .3s linear;z-index:3}
.car svg{width:78%;height:78%;transition:transform .3s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.car.ghost{opacity:.55;z-index:2}
.car.spin svg{animation:spin .6s}
@keyframes spin{to{transform:rotate(var(--r2))}}
.cmd.F{background:var(--ink)} .cmd.TL{background:var(--left)} .cmd.TR{background:var(--coral)}
.chip.F{background:var(--ink)} .chip.TL{background:var(--left)} .chip.TR{background:var(--coral)}
.cmd .lbl{font-size:11px;font-weight:800;line-height:1;margin-top:-2px}
.cmd.rc{display:flex;flex-direction:column;gap:2px;width:76px}
.racebar{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.racebar div{flex:1;min-width:130px;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;background:var(--paper)}
.racebar b{font-family:var(--font-display);font-size:24px;display:block;line-height:1.1}
.lights{display:flex;gap:8px;justify-content:center;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#16324F;padding:10px 14px;border-radius:16px;z-index:5}
.lights i{width:26px;height:26px;border-radius:50%;background:#33475B}
.lights i.on{background:#E5484D}
.lights.go i{background:#3FAE5E}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .stage{grid-template-columns:1fr}
  .ghead h2{font-size:26px}
  .cmd{width:58px;height:58px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.noprint{display:none!important} .pcard{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<header class="top"><div class="in">
  <button class="logo" id="homeBtn" aria-label="Ana sayfa"><span class="mark">{ }</span><span>Kod Kaşifleri<small>Algoritma · Mantık · Kamera</small></span></button>
  <div class="sp"></div>
  <button class="icon-btn" id="soundBtn" aria-label="Sesi aç/kapat" title="Ses">🔊</button>
</div></header>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* ============ helpers ============ */
const $app = document.getElementById('app');
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

let soundOn = store.get('sound', true);
let actx = null;
function tone(freq, dur = .12, type = 'sine', vol = .15, delay = 0){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch(e){}
}

  step(){ tone(520, .08, 'triangle', .12); },
  add(){ tone(700, .06, 'square', .06); },
  bump(){ tone(140, .25, 'sawtooth', .12); },
  coin(){ tone(880, .08, 'square', .08); tone(1320, .12, 'square', .08, .08); },
  win(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', .14, i * .11)); },
  no(){ tone(260, .15, 'triangle', .12); tone(200, .2, 'triangle', .12, .12); },
  ok(){ tone(660, .1, 'triangle', .12); tone(990, .14, 'triangle', .12, .09); }

function say(text){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}\s.,!?'’-]/gu, ' '));
    u.lang = 'tr-TR'; u.rate = .95;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('tr'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ============ Board ============ */
class Board {
  constructor(map){
    this.map = map; this.h = map.length; this.w = map[0].length;
    this.wrap = h('div', { class:'boardwrap' });
    this.el = h('div', { class:'board', style:`--w:${this.w};grid-template-columns:repeat(${this.w},1fr);max-width:${this.w * 76}px` });
    this.cells = []; this.acorns = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++){
      const c = map[y][x];
      const cls = c === '~' ? 'w' : 'g' + ((x + y) % 2 ? ' alt' : '') + (c === 'S' ? ' s' : '');
      const cell = h('div', { class:'cell ' + cls });
      if (c === '#') cell.append(h('span', { class:'e' }, '🪨'));
      if (c === 'G') cell.append(h('span', { class:'e' }, '🌳'));
      if (c === '*'){ const e = h('span', { class:'e' }, '🌰'); cell.append(e); this.acorns.push({ x, y, e }); }
      if (c === 'S') this.start = [x, y];
      if (c === 'G') this.goal = [x, y];
      this.el.append(cell);
    }
    this.sprite = h('div', { class:'hero-sprite', style:`width:${100 / this.w}%;height:${100 / this.h}%` }, h('span', { class:'e' }, '🐿️'));
    this.el.append(this.sprite);
    this.wrap.append(this.el);
    this.reset();
  }
  reset(){
    this.pos = this.start.slice(); this.got = new Set(); this.won = false;
    this.acorns.forEach(a => a.e.classList.remove('got'));
    this.sprite.classList.remove('win', 'bump');
    this.place();
  }
  place(){
    // account for the 4px grid gap
    const [x, y] = this.pos, gapX = 4 * (this.w - 1) / this.w, gapY = 4 * (this.h - 1) / this.h;
    this.sprite.style.left = `calc(${x * 100 / this.w}% + ${x * 4 - x * gapX}px)`;
    this.sprite.style.top = `calc(${y * 100 / this.h}% + ${y * 4 - y * gapY}px)`;
    this.sprite.style.width = `calc(${100 / this.w}% - ${gapX}px)`;
    this.sprite.style.height = `calc(${100 / this.h}% - ${gapY}px)`;
  }
  tile(x, y){ return (y < 0 || y >= this.h || x < 0 || x >= this.w) ? null : this.map[y][x]; }
  allGot(){ return this.got.size === this.acorns.length; }
  async step(d){
    const [dx, dy] = DIRS[d], nx = this.pos[0] + dx, ny = this.pos[1] + dy, t = this.tile(nx, ny);
    const e = this.sprite.querySelector('.e');
    if (d === 'L') e.style.transform = 'scaleX(-1)'; else if (d === 'R') e.style.transform = '';
    if (t == null || t === '#' || t === '~'){
      this.sprite.style.setProperty('--bx', dx * 30 + '%'); this.sprite.style.setProperty('--by', dy * 30 + '%');
      this.sprite.classList.remove('bump'); void this.sprite.offsetWidth; this.sprite.classList.add('bump');
      sfx.bump(); await sleep(380);
      return t === '~' ? 'water' : t === '#' ? 'rock' : 'edge';
    }
    this.pos = [nx, ny]; this.place(); sfx.step();
    await sleep(330);
    const a = this.acorns.find(a => a.x === nx && a.y === ny);
    if (a && !this.got.has(a)){ this.got.add(a); a.e.classList.add('got'); sfx.coin(); }
    if (t === 'G' && this.allGot()){ this.won = true; this.sprite.classList.add('win'); sfx.win(); return 'win'; }
    return 'ok';
  }
}
/* shortest path including acorns (BFS over position + collected mask) */
function shortest(map){
  const H = map.length, W = map[0].length, ac = []; let s, g;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){ const c = map[y][x]; if (c === 'S') s = [x, y]; if (c === 'G') g = [x, y]; if (c === '*') ac.push(x + ',' + y); }
  const full = (1 << ac.length) - 1, seen = new Set(), q = [[s[0], s[1], 0, 0]];
  seen.add(s + ',0');
  while (q.length){
    const [x, y, m, d] = q.shift();
    if (x === g[0] && y === g[1] && m === full) return d;
    for (const k in DIRS){
      const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
      if (ny < 0 || ny >= H || nx < 0 || nx >= W) continue;
      const c = map[ny][nx]; if (c === '#' || c === '~') continue;
      let nm = m; const ai = ac.indexOf(nx + ',' + ny); if (ai >= 0) nm |= 1 << ai;
      if (x === g[0] && y === g[1] && m === full) continue;
      const key = nx + ',' + ny + ',' + nm; if (seen.has(key)) continue; seen.add(key);
      q.push([nx, ny, nm, d + 1]);
    }
  }
  return -1;
}

/* ============ program editor (Hazine Avı) ============ */
function countBlocks(prog){ return prog.reduce((n, it) => n + (it.t === 'loop' ? 1 + it.body.length : 1), 0); }
function flatten(prog){
  const out = [];
  prog.forEach((it, i) => {
    if (it.t === 'loop'){ for (let k = 0; k < it.n; k++) it.body.forEach((d, j) => out.push({ d, path:i + '.' + j })); }
    else out.push({ d:it.d, path:String(i) });
  });
  return out;
}
function chip(d, attrs){ const c = h('button', Object.assign({ class:'chip ' + d, 'aria-label':DIR_NAME[d] }, attrs || {})); c.append(arrowSvg(d)); return c; }
function cmdBtn(d, on){ const b = h('button', { class:'cmd ' + d, 'aria-label':DIR_NAME[d] + ' ekle', title:DIR_NAME[d], onclick:on }); b.append(arrowSvg(d)); return b; }

async function runProgram(board, steps, highlight){
  const my = ++runToken;
  board.reset(); await sleep(250);
  for (let i = 0; i < steps.length; i++){
    if (my !== runToken) return { res:'abort' };
    highlight(steps[i].path);
    const r = await board.step(steps[i].d);
    if (my !== runToken) return { res:'abort' };
    if (r === 'win') return { res:'win' };
    if (r !== 'ok') return { res:r, at:steps[i].path };
  }
  highlight(null);
  const atGoal = board.pos[0] === board.goal[0] && board.pos[1] === board.goal[1];
  return { res:atGoal ? 'acorn' : 'short' };
}

/* ============ LOGIC: shared circuit renderer ============ */
const GATE = {
  VE:{ label:'VE', sub:'ikisi birden', color:'#E8553A' },
  VEYA:{ label:'VEYA', sub:'biri yeter', color:'#2F8FE0' },
  DEGIL:{ label:'DEĞİL', sub:'tersine çevir', color:'#7457D3' }
};
const I = n => ({ in:n });
const G = (op, ...k) => ({ op, k });
const SLOT = (...k) => ({ slot:true, k });
function inputsOf(e, out = []){ if (e.in){ if (!out.includes(e.in)) out.push(e.in); } else e.k.forEach(c => inputsOf(c, out)); return out; }
function evalE(e, env, slotOp){
  if (e.in) return !!env[e.in];
  const op = e.slot ? slotOp : e.op, v = e.k.map(c => evalE(c, env, slotOp));
  if (!op) return false;
  return op === 'VE' ? v.every(Boolean) : op === 'VEYA' ? v.some(Boolean) : !v[0];
}
function depth(e){ return e.in ? 0 : 1 + Math.max(...e.k.map(depth)); }
function combos(names){ const out = []; for (let m = 0; m < (1 << names.length); m++){ const env = {}; names.forEach((n, i) => env[n] = !!(m >> (names.length - 1 - i) & 1)); out.push(env); } return out; }
function envKey(env, names){ return names.map(n => env[n] ? 1 : 0).join(''); }

function drawCircuit(e, env, { slotOp, onToggle, lampLabel } = {}){
  const NS = 'http://www.w3.org/2000/svg';
  const D = depth(e), rowH = 84, top = 26, colW = 168, gx0 = 150, gw = 104, gh = 58;
  const leaves = []; // leaf instances in DFS order
  const nodes = [];
  function lay(n, level){
    if (n.in){ const y = top + leaves.length * rowH + rowH / 2; leaves.push(n); const node = { n, y, x:100, leaf:true }; nodes.push(node); return node; }
    const kids = n.k.map(c => lay(c, level + 1));
    const y = kids.reduce((s, k) => s + k.y, 0) / kids.length;
    const col = D - 1 - level, x = gx0 + col * colW;
    const node = { n, y, x, kids }; nodes.push(node); return node;
  }
  const root = lay(e, 0);
  const lampX = gx0 + D * colW + 40, W = lampX + 70, H = top + leaves.length * rowH + 10;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'circuit'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Mantık devresi');
  const el = (tag, attrs, parent = svg) => { const x = document.createElementNS(NS, tag); for (const k in attrs) x.setAttribute(k, attrs[k]); parent.append(x); return x; };
  const val = n => evalE(n, env, slotOp);
  // wires first
  nodes.filter(nd => !nd.leaf).forEach(nd => {
    nd.kids.forEach((kd, i) => {
      const py = nd.y + (nd.kids.length === 1 ? 0 : (i === 0 ? -15 : 15));
      const sx = kd.leaf ? 100 : kd.x + gw, sy = kd.y, px = nd.x, mx = px - 24 - (i * 6);
      const on = val(kd.n);
      el('path', { d:`M${sx} ${sy} H${mx} V${py} H${px}`, fill:'none', stroke:on ? '#FFC63A' : '#A9BCC9', 'stroke-width':on ? 7 : 5, 'stroke-linejoin':'round', 'stroke-linecap':'round' });
    });
  });
  const rootOn = val(e);
  el('path', { d:`M${root.leaf ? 100 : root.x + gw} ${root.y} H${lampX - 28}`, fill:'none', stroke:rootOn ? '#FFC63A' : '#A9BCC9', 'stroke-width':rootOn ? 7 : 5, 'stroke-linecap':'round' });
  // gates
  nodes.filter(nd => !nd.leaf).forEach(nd => {
    const op = nd.n.slot ? slotOp : nd.n.op, g = op ? GATE[op] : null;
    const grp = el('g', {});
    el('rect', { x:nd.x, y:nd.y - gh / 2, width:gw, height:gh, rx:14, fill:g ? g.color : '#FFFFFF', stroke:'#16324F', 'stroke-width':3, 'stroke-dasharray':nd.n.slot && !op ? '7 5' : '0' }, grp);
    const t = el('text', { x:nd.x + gw / 2, y:nd.y + (g ? 2 : 10), 'text-anchor':'middle', 'font-size':g ? 24 : 30, fill:g ? '#fff' : '#16324F' }, grp); t.textContent = g ? g.label : '?';
    if (g){ const s = el('text', { x:nd.x + gw / 2, y:nd.y + 20, 'text-anchor':'middle', 'font-size':12, fill:'#fff', 'font-family':'Nunito,sans-serif' }, grp); s.textContent = g.sub; }
    if (nd.n.slot && op){ el('rect', { x:nd.x - 4, y:nd.y - gh / 2 - 4, width:gw + 8, height:gh + 8, rx:17, fill:'none', stroke:'#FFC63A', 'stroke-width':3, 'stroke-dasharray':'6 4' }, grp); }
  });
  // switches
  nodes.filter(nd => nd.leaf).forEach(nd => {

const COLOR_HEX = { U:'#3FAE5E', D:'#E5484D', L:'#2F8FE0', R:'#F2B705' };
function classify(r, g, b){
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (mx < 70 || d / mx < .4) return null;
  let hh;
  if (mx === r) hh = 60 * (((g - b) / d) % 6); else if (mx === g) hh = 60 * ((b - r) / d + 2); else hh = 60 * ((r - g) / d + 4);
  if (hh < 0) hh += 360;
  if (hh < 14 || hh >= 340) return 'D';
  if (hh >= 36 && hh < 70) return 'R';
  if (hh >= 85 && hh < 165) return 'U';
  if (hh >= 190 && hh < 250) return 'L';
  return null;
}
function camPanel({ zones = false }){
  const video = h('video', { playsinline:true, muted:true, autoplay:true, class:'mirror' });
  video.muted = true;
  const off = h('div', { class:'off' }, h('div', null, h('div', { style:'font-size:44px' }, '📷'), h('p', { style:'margin:6px 0 12px' }, 'Kamera kapalı'),
    h('button', { class:'go', onclick:() => api.start() }, 'Kamerayı aç')));
  const box = zones ? null : h('div', { class:'box' });
  const zEl = zones ? h('div', { class:'zones' }, h('div', { class:'zu' }, '↑'), h('div', { class:'zd' }, '↓'), h('div', { class:'zl' }, '←'), h('div', { class:'zr' }, '→')) : null;
  const el = h('div', { class:'cam' }, video, box, zEl, off);
  const note = h('div', { class:'camnote', hidden:true });
  const cv = document.createElement('canvas'); cv.width = zones ? 80 : 160; cv.height = zones ? 60 : 120;
  const ctx = cv.getContext('2d', { willReadFrequently:true });
  let stream = null, timer = null;
  const api = {
    el, note, box, zEl, onFrame:null,
    async start(){
      note.hidden = true;
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('nomedia');
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ ideal:640 }, height:{ ideal:480 } }, audio:false });
        video.srcObject = stream; await video.play().catch(() => {});
        off.hidden = true;
        timer = setInterval(() => {
          if (video.readyState < 2) return;
          ctx.drawImage(video, 0, 0, cv.width, cv.height);
          api.onFrame && api.onFrame(ctx.getImageData(0, 0, cv.width, cv.height), cv.width, cv.height);
        }, 110);
      } catch(e){
        note.hidden = false;
        note.textContent = 'Kamera açılamadı. Paylaşılan sayfa tarayıcıdan kamera izni alamıyor olabilir. Canlı kamerayla oynamak için oyunun bilgisayara indirilen sürümünü (Kod_Kasifleri.html) Chrome ile açın. Bu sırada aşağıdaki butonlarla oynayabilirsiniz.';
      }

  };

}
/* dominant colour inside the centre box of a frame */
function boxColor(img, W, H){
  const cnt = { U:0, D:0, L:0, R:0 }; let tot = 0;
  const x0 = Math.floor(W * .3), x1 = Math.floor(W * .7), y0 = Math.floor(H * .22), y1 = Math.floor(H * .78);
  for (let y = y0; y < y1; y += 2) for (let x = x0; x < x1; x += 2){
    // video is mirrored on screen, the box is centred so mirroring does not matter
    const i = (y * W + x) * 4, c = classify(img.data[i], img.data[i + 1], img.data[i + 2]); tot++;
    if (c) cnt[c]++;
  }
  const best = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  if (best[0][1] > tot * .14 && best[0][1] > best[1][1] * 1.6) return best[0][0];
  return null;
}

function readCardRow(img){
  const W = 480, H = Math.max(40, Math.round(img.naturalHeight * W / img.naturalWidth));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently:true }); ctx.drawImage(img, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H).data;
  const y0 = Math.floor(H * .08), y1 = Math.floor(H * .92), band = y1 - y0;
  const col = [];
  for (let x = 0; x < W; x++){
    const cnt = { U:0, D:0, L:0, R:0 };
    for (let y = y0; y < y1; y += 2){ const i = (y * W + x) * 4, c = classify(d[i], d[i + 1], d[i + 2]); if (c) cnt[c]++; }
    const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    col.push(best[1] >= Math.max(4, band / 2 * .12) ? best[0] : null);
  }
  let runs = [];
  for (let x = 0; x < W;){
    const c = col[x]; let e = x; while (e < W && col[e] === c) e++;
    if (c) runs.push({ c, x0:x, x1:e });
    x = e;
  }
  // merge tiny gaps of the same colour, then drop specks
  const merged = [];
  runs.forEach(r => { const last = merged[merged.length - 1]; if (last && last.c === r.c && r.x0 - last.x1 <= 3) last.x1 = r.x1; else merged.push({ ...r }); });
  runs = merged.filter(r => r.x1 - r.x0 >= W * .025);
  if (!runs.length) return { cmds:[], canvas:cv };
  const widths = runs.map(r => r.x1 - r.x0).sort((a, b) => a - b), med = widths[Math.floor(widths.length / 2)];
  const out = [];
  runs.forEach(r => { const k = Math.max(1, Math.round((r.x1 - r.x0) / med)); const w = (r.x1 - r.x0) / k; for (let i = 0; i < k; i++) out.push({ c:r.c, x0:r.x0 + i * w, x1:r.x0 + (i + 1) * w }); });
  ctx.lineWidth = 4; ctx.font = 'bold 22px sans-serif';
  out.forEach((r, i) => { ctx.strokeStyle = '#16324F'; ctx.strokeRect(r.x0 + 2, y0, r.x1 - r.x0 - 4, band); ctx.fillStyle = '#16324F'; ctx.fillRect(r.x0 + 2, y0, 30, 28); ctx.fillStyle = '#fff'; ctx.fillText(i + 1, r.x0 + 8, y0 + 22); });
  return { cmds:out.map(r => r.c), canvas:cv };
}

      const c = map[ny][nx]; if (c === '#' || c === '~') continue;

      const nk = nx + ',' + ny + ',' + nm; if (prev.has(nk)) continue; prev.set(nk, [key, d]); q.push([nx, ny, nm]);
    }

}

function liveGame(key, title, intro, lvArg, zones){

  const L = HZ_LEVELS[CAM_LEVELS[lvArg]], board = new Board(L.map), par = shortest(L.map);

  $app.append(gameHead(title, `Bölüm ${lvArg + 1}: ${L.name}`, () => go(key)));

  } else {

    h('div', { class:'panel' }, cam.el, cam.note, extra, h('p', { class:'small', style:'margin:14px 0 0;font-weight:800' }, 'Kamerasız deneme butonları'), pad)));

    this.reset();
  }
  mkCar(color, ghost){ const el = h('div', { class:'car' + (ghost ? ' ghost' : '') }); el.append(carSvg(color)); this.el.append(el); return { el, x:0, y:0, hd:0, ang:0 }; }
  place(c){
    const gx = 4 * (this.w - 1) / this.w, gy = 4 * (this.h - 1) / this.h;
    c.el.style.left = `calc(${c.x * 100 / this.w}% + ${c.x * 4 - c.x * gx}px)`;
    c.el.style.top = `calc(${c.y * 100 / this.h}% + ${c.y * 4 - c.y * gy}px)`;
    c.el.style.width = `calc(${100 / this.w}% - ${gx}px)`;
    c.el.style.height = `calc(${100 / this.h}% - ${gy}px)`;
    c.el.querySelector('svg').style.transform = `rotate(${c.ang}deg)`;
  }
  reset(){
    [this.car, this.ghost].forEach(c => { c.x = this.start[0]; c.y = this.start[1]; c.hd = this.L.h; c.ang = this.L.h * 90; c.el.classList.remove('spin'); this.place(c); });
    this.ghost.el.hidden = true;
  }
  road(x, y){ return y >= 0 && y < this.h && x >= 0 && x < this.w && '=SF'.includes(this.map[y][x]); }
  act(c, a){
    if (a === 'TL'){ c.hd = (c.hd + 3) % 4; c.ang -= 90; this.place(c); return 'ok'; }
    if (a === 'TR'){ c.hd = (c.hd + 1) % 4; c.ang += 90; this.place(c); return 'ok'; }
    const nx = c.x + HDX[c.hd], ny = c.y + HDY[c.hd];
    if (!this.road(nx, ny)){
      c.x = c.x + HDX[c.hd] * .35; c.y = c.y + HDY[c.hd] * .35; this.place(c);
      c.el.style.setProperty('--r2', (c.ang + 360) + 'deg'); c.el.classList.add('spin');
      return 'crash';
    }
    c.x = nx; c.y = ny; this.place(c);
    return this.map[ny][nx] === 'F' ? 'finish' : 'ok';
  }
}
function flatRace(prog){
  const out = [];
  prog.forEach((it, i) => {
    if (it.t === 'loop'){ for (let k = 0; k < it.n; k++) it.body.forEach((c, j) => out.push({ c, path:i + '.' + j })); }
    else out.push({ c:it.c, path:String(i) });
  });
  return out;
}
SCREENS.ralli = (lvArg) => {
  if (lvArg == null){
    levelSelect('ralli', 'Kod Rallisi', 'Yarış arabasını programla! Bu oyunda yönler arabanın kendisine göredir: “Sağa dön” arabanın kendi sağıdır. Hayalet rakip en kısa yoldan ama biraz yavaş gidiyor. Onu geçmek için en verimli programı yaz.', RACE_LEVELS.map(l => l.name), i => go('ralli', i));
    return;
  }
  const L = RACE_LEVELS[lvArg], track = new RaceTrack(L), best = raceSolve(L);
  const opt = best.length, rivalT = opt + L.slack, par = L.par || opt;
  let prog = [], openLoop = -1, running = false;
  $app.append(gameHead('Kod Rallisi', `Yarış ${lvArg + 1}: ${L.name}`, () => go('ralli')));
  $app.append(taskBar(L.tip));
  const progEl = h('div', { class:'prog', 'data-empty':'Programın burada görünecek. İleri, Sola dön, Sağa dön bloklarına dokun.' });
  const counter = h('div', { class:'counter' }), msg = h('div', { class:'msg', role:'status' });
  const youT = h('b', null, '0'), rivT = h('b', null, String(rivalT));
  const bar = h('div', { class:'racebar' }, h('div', { style:'border-color:#E5484D' }, 'Senin programın', youT, h('span', { class:'muted small' }, 'adım sürüyor')), h('div', { style:'border-color:#2F8FE0' }, 'Hayalet rakip', rivT, h('span', { class:'muted small' }, 'adımda bitiriyor')));
  const runBtn = h('button', { class:'go', onclick:race }, '🏁 Yarış!');
  const rchip = (c, attrs) => { const b = h('button', Object.assign({ class:'chip ' + c, 'aria-label':RC_NAME[c] }, attrs)); b.append(raceIcon(c)); return b; };
  function add(c){ if (running) return; if (openLoop >= 0) prog[openLoop].body.push(c); else prog.push({ t:'cmd', c }); sfx.add(); render(); }
  function render(){
    progEl.innerHTML = '';
    prog.forEach((it, i) => {
      if (it.t === 'cmd') progEl.append(rchip(it.c, { 'data-path':String(i), title:'Silmek için dokun', onclick:() => { if (running) return; prog.splice(i, 1); if (openLoop > i) openLoop--; render(); } }));
      else {
        const body = h('div', { class:'lb' });
        it.body.forEach((c, j) => body.append(rchip(c, { 'data-path':i + '.' + j, title:'Silmek için dokun', onclick:() => { if (running) return; it.body.splice(j, 1); render(); } })));
        progEl.append(h('div', { class:'loopbox' + (openLoop === i ? ' open' : '') },
          h('span', { class:'lh' }, '🔁', h('button', { class:'cnt', 'aria-label':`${it.n} kere tekrarla, değiştirmek için dokun`, onclick:() => { if (running) return; it.n = it.n >= 12 ? 2 : it.n + 1; render(); } }, '×' + it.n)),
          body,
          openLoop === i ? h('button', { class:'done', onclick:() => { openLoop = -1; render(); } }, 'Bitti') : h('button', { class:'x', 'aria-label':'Döngüyü sil', onclick:() => { if (running) return; prog.splice(i, 1); if (openLoop > i) openLoop--; render(); } }, '×')));
      }
    });
    const blocks = countBlocks(prog.map(it => it.t === 'loop' ? it : { t:'dir' }));
    counter.innerHTML = ''; counter.append('Kullanılan yakıt (blok): ', h('b', null, blocks), L.loops ? `  ·  Hedef: en fazla ${par} blok` : '');
    youT.textContent = flatRace(prog).length;
    runBtn.disabled = !prog.length;
  }
  const hl = p => progEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('now', c.dataset.path === p));
  async function lights(my){
    const box = h('div', { class:'lights' }, h('i'), h('i'), h('i'));
    track.wrap.append(box);
    for (let i = 0; i < 3; i++){ box.children[i].classList.add('on'); tone(440, .12, 'square', .08); await sleep(380); if (my !== runToken){ box.remove(); return false; } }
    box.classList.add('go'); tone(880, .3, 'square', .1); await sleep(300); box.remove();
    return my === runToken;
  }
  async function race(){
    if (running || !prog.length) return;
    running = true; openLoop = -1; render(); msg.textContent = ''; msg.className = 'msg';
    const my = ++runToken;
    track.reset(); track.ghost.el.hidden = false;
    if (!(await lights(my))){ running = false; return; }
    const steps = flatRace(prog);
    let res = null, youTime = 0, ghostDone = 0;
    for (let t = 1; t <= Math.max(steps.length, rivalT) && !res; t++){
      if (my !== runToken) return;
      const due = Math.min(opt, Math.floor(t * opt / rivalT));
      while (ghostDone < due) track.act(track.ghost, best[ghostDone++]);
      if (t <= steps.length){
        hl(steps[t - 1].path);
        const r = track.act(track.car, steps[t - 1].c);
        if (r === 'ok') sfx.step();
        if (r === 'crash'){ res = { res:'crash', at:steps[t - 1].path }; sfx.bump(); }
        if (r === 'finish'){ youTime = t; res = { res:'finish' }; }
      } else if (!res && t > steps.length){ res = { res:'short' }; }
      await sleep(360);
    }
    if (my !== runToken) return;
    if (!res) res = { res:'short' };
    running = false; hl(null);
    if (res.res === 'finish' && youTime <= rivalT){
      while (ghostDone < opt) track.act(track.ghost, best[ghostDone++]);
      sfx.win();
      const blocks = countBlocks(prog.map(it => it.t === 'loop' ? it : { t:'dir' }));
      const s = blocks <= par ? 3 : 2;
      setStars('ralli-' + lvArg, s);
      modal({ icon:'🏆', title:youTime === rivalT ? 'Foto finiş! Kazandın!' : 'Birinci sensin!', starsN:s,
        text:`Senin araban ${youTime} adımda, hayalet rakip ${rivalT} adımda bitirdi.` + (s < 3 ? ` Yakıtı ${par} bloğa indirirsen 3 yıldız alırsın.` : ''),
        buttons:[ lvArg < RACE_LEVELS.length - 1 ? { label:'Sonraki yarış →', primary:true, on:() => go('ralli', lvArg + 1) } : { label:'Yarışlar', primary:true, on:() => go('ralli') }, { label:'Tekrar yarış', on:() => track.reset() } ] });
      return;
    }
    sfx.no(); msg.className = 'msg bad';
    if (res.res === 'crash'){ msg.textContent = 'Pist dışı! Araba yoldan çıktı. Kırmızı yanıp sönen bloğa bak.'; progEl.querySelector(`[data-path="${res.at}"]`)?.classList.add('bad'); }
    else if (res.res === 'finish') msg.textContent = `Bitirdin ama hayalet rakip daha hızlıydı: sen ${youTime}, rakip ${rivalT} adım. Daha kısa bir yol ya da daha az dönüş dene.`;
    else msg.textContent = 'Program bitti ama araba bitiş çizgisine ulaşamadı. Biraz daha blok ekle.';
  }
  const rcmd = c => { const b = h('button', { class:'cmd rc ' + c, 'aria-label':RC_NAME[c] + ' ekle', onclick:() => add(c) }); b.append(raceIcon(c), h('span', { class:'lbl' }, RC_NAME[c])); return b; };
  const pal = h('div', { class:'palette' }, rcmd('TL'), rcmd('F'), rcmd('TR'));
  if (L.loops) pal.append(h('button', { class:'cmd loop', onclick:() => { if (running || openLoop >= 0) return; prog.push({ t:'loop', n:2, body:[] }); openLoop = prog.length - 1; sfx.add(); render(); } }, '🔁 Tekrarla'));
  const right = h('div', { class:'panel' }, h('h3', null, 'Arabanın programı'), pal, progEl, counter, bar,
    h('div', { class:'row', style:'margin-top:12px' }, runBtn,
      h('button', { class:'ghost', onclick:() => { if (running) return; if (openLoop >= 0 && prog[openLoop].body.length) prog[openLoop].body.pop(); else { prog.pop(); openLoop = -1; } render(); } }, '⌫ Geri al'),
      h('button', { class:'ghost', onclick:() => { runToken++; running = false; prog = []; openLoop = -1; track.reset(); msg.textContent = ''; render(); } }, 'Temizle')), msg,
    h('p', { class:'muted small', style:'margin:10px 0 0' }, 'Dönüş blokları arabayı yerinde çevirir ve 1 adım sürer. Her dönüş zaman kaybettirir!'));
  $app.append(h('div', { class:'stage' }, track.wrap, right));
  const keys = e => { const m = { ArrowUp:'F', ArrowLeft:'TL', ArrowRight:'TR' }[e.key]; if (m){ e.preventDefault(); add(m); } };
  document.addEventListener('keydown', keys); cleanup = () => document.removeEventListener('keydown', keys);
  render();
};
GAMES.algo.splice(1, 0, { id:'ralli', ico:'🏎️', bg:'#FFE1D6', name:'Kod Rallisi', desc:'Yarış arabasını programla, hayalet rakibi geç. Sağa ve sola dönüş arabaya göre!', learn:'Göreli yön, en kısa yol, verimli algoritma', count:RACE_LEVELS.length });
